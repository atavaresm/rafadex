name: version-check

on:
  pull_request:
    branches: [master]

jobs:
  check:
    name: version-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check VERSION was bumped
        run: |
          BASE_VERSION=$(git show origin/master:VERSION)
          python3 bump_version.py --check "$BASE_VERSION"
